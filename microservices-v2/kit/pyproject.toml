[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-mskit"
version = "2.0.0"
description = "Shared plumbing for marketplace v2 services: settings, auth, errors, correlation, logging, call policy, app factory, data copy"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["mskit*"]

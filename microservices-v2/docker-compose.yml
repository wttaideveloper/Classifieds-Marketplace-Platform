# Marketplace v2: gateway + 11 services, each with ITS OWN database (one PostgreSQL server, 11 databases here;
# use separate servers in production if you prefer), Redis for real-time events between services.
#
#   cd microservices-v2
#   cp .env.example .env                                   # placeholders only; edit locally
#   docker compose up -d db redis
#   docker compose --profile init run --rm schema-init     # FIRST RUN ONLY: creates every service's tables in its NEW database
#   docker compose up -d --build
#   curl http://localhost:8000/_gateway/ready
#
# Build context = repository root. Nothing here touches the monolith's database. Copying the monolith's data into
# these databases is a separate, explicit step (docs/DATA_MIGRATION.md).

x-service: &service
  env_file: .env
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  volumes:
    - uploads_data:/app/uploads
  restart: unless-stopped

x-env: &common-env
  SOCKETIO_REDIS_URL: redis://redis:6379/0
  UPLOAD_DIR: /app/uploads
  AUTO_CREATE_TABLES: "false"
  IDENTITY_SERVICE_URL: http://identity:8000
  CATALOG_SERVICE_URL: http://catalog:8000
  BOOKING_SERVICE_URL: http://booking:8000
  EVENTS_SERVICE_URL: http://events:8000
  LEARNING_SERVICE_URL: http://learning:8000
  COMMERCE_SERVICE_URL: http://commerce:8000
  COMMUNICATION_SERVICE_URL: http://communication:8000
  NOTIFICATIONS_SERVICE_URL: http://notifications:8000
  CONTENT_SERVICE_URL: http://content:8000
  MEETINGS_SERVICE_URL: http://meetings:8000
  MODERATION_SERVICE_URL: http://moderation:8000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:55433:5432"]
    volumes:
      - v2_postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create each service's tables in its own new database (explicit: --profile init).
  schema-init:
    profiles: ["init"]
    build: { context: .., dockerfile: microservices-v2/docker/Dockerfile.tools }
    env_file: .env
    environment:
      <<: *common-env
      DB_HOST: db
    depends_on:
      db: { condition: service_healthy }
    command: ["python", "/srv/tools/create_all_schemas.py"]

  identity:
    <<: *service
    build: { context: .., dockerfile: microservices-v2/services/identity/Dockerfile }
    environment: { <<: *common-env, DATABASE_URL: "postgresql://postgres:postgres@db:5432/identity_db" }
    ports: ["127.0.0.1:8201:8000"]
  catalog:
    <<: *service
    build: { context: .., dockerfile: microservices-v2/services/catalog/Dockerfile }
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/catalog_db"
      REPLICA_SUBSCRIBERS: "events,learning,commerce,booking,communication"   # who holds copies of enterprises/locations/products/services
    ports: ["127.0.0.1:8202:8000"]
  booking:
    <<: *service
    build: { context: .., dockerfile: microservices-v2/services/booking/Dockerfile }
    environment: { <<: *common-env, DATABASE_URL: "postgresql://postgres:postgres@db:5432/booking_db" }
    ports: ["127.0.0.1:8203:8000"]
  events:
    <<: *service
    build: { context: .., dockerfile: microservices-v2/services/events/Dockerfile }
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/events_db"
      EVENTS_REPLICA_SUBSCRIBERS: "communication"
    ports: ["127.0.0.1:8204:8000"]
  learning:
    <<: *service
    build: { context: .., dockerfile: microservices-v2/services/learning/Dockerfile }
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/learning_db"
      LEARNING_REPLICA_SUBSCRIBERS: "communication"
    ports: ["127.0.0.1:8205:8000"]
  commerce:
    <<: *service
    build: { context: .., dockerfile: microservices-v2/services/commerce/Dockerfile }
    environment: { <<: *common-env, DATABASE_URL: "postgresql://postgres:postgres@db:5432/commerce_db" }
    ports: ["127.0.0.1:8206:8000"]
  communication:
    <<: *service
    build: { context: .., dockerfile: microservices-v2/services/communication/Dockerfile }
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/communication_db"
      WEB_CONCURRENCY: "1"   # Engine.IO polling sessions live in process memory: one worker (as in the monolith)
    ports: ["127.0.0.1:8207:8000"]
  notifications:
    <<: *service
    build: { context: .., dockerfile: microservices-v2/services/notifications/Dockerfile }
    environment: { <<: *common-env, DATABASE_URL: "postgresql://postgres:postgres@db:5432/notifications_db" }
    ports: ["127.0.0.1:8208:8000"]
  content:
    <<: *service
    build: { context: .., dockerfile: microservices-v2/services/content/Dockerfile }
    environment: { <<: *common-env, DATABASE_URL: "postgresql://postgres:postgres@db:5432/content_db" }
    ports: ["127.0.0.1:8209:8000"]
  meetings:
    <<: *service
    build: { context: .., dockerfile: microservices-v2/services/meetings/Dockerfile }
    environment: { <<: *common-env, DATABASE_URL: "postgresql://postgres:postgres@db:5432/meetings_db" }
    ports: ["127.0.0.1:8210:8000"]
  moderation:
    <<: *service
    build: { context: .., dockerfile: microservices-v2/services/moderation/Dockerfile }
    environment: { <<: *common-env, DATABASE_URL: "postgresql://postgres:postgres@db:5432/moderation_db" }
    ports: ["127.0.0.1:8211:8000"]

  gateway:
    build: { context: .., dockerfile: microservices-v2/gateway/Dockerfile }
    env_file: .env
    environment: *common-env
    ports: ["8000:8000"]
    depends_on:
      identity: { condition: service_healthy }
      catalog: { condition: service_healthy }
      booking: { condition: service_healthy }
      events: { condition: service_healthy }
      learning: { condition: service_healthy }
      commerce: { condition: service_healthy }
      communication: { condition: service_healthy }
      notifications: { condition: service_healthy }
      content: { condition: service_healthy }
      meetings: { condition: service_healthy }
      moderation: { condition: service_healthy }
    restart: unless-stopped

volumes:
  v2_postgres_data:
  uploads_data:
